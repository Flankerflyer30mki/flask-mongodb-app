# Headless Service (clusterIP: None) for MongoDB.
# - Gives the StatefulSet pod a stable DNS name: mongodb-0.mongodb.default.svc.cluster.local
# - `mongodb` also resolves to the pod, which is what the Flask app uses.
# - Not NodePort/LoadBalancer, so MongoDB is reachable only from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
