# Credentials for the MongoDB root user. Read by both the MongoDB StatefulSet and the Flask Deployment.
# Demo values only. In a real cluster, create this from a secret manager (Sealed Secrets,
# External Secrets, Vault) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
type: Opaque
stringData:
  MONGO_USERNAME: admin
  MONGO_PASSWORD: change-me-s3cret
