# Exposes the Flask app inside the cluster (flask-service:5000) and on the node at port 30500.
# On Minikube, `minikube service flask-service --url` gives a URL reachable from your machine.
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
