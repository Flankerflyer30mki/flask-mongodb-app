# Flask app, 2 replicas. The HPA (flask-hpa.yaml) scales it between 2 and 5.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: DOCKERHUB_USERNAME/flask-mongodb-app:1.0   # replace with your Docker Hub username
          ports:
            - containerPort: 5000
          env:
            # "mongodb" is the MongoDB Service name; cluster DNS resolves it to the MongoDB pod.
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_PASSWORD
          resources:
            requests:   # the HPA measures CPU as a percentage of this request
              cpu: 200m
              memory: 250M
            limits:
              cpu: 500m
              memory: 500M
          readinessProbe:   # only send traffic to a pod once it answers HTTP
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:    # restart the container if it stops answering
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
